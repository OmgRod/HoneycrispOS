name: Build Honeycrisp OS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      - name: Build Flutter Shell
        run: |
          cd /path/to/honeycrisp_shell  # Update to your actual Flutter project path if nested
          flutter build linux --release

      - name: Inject Flutter Bundle into Live-Build Tree
        run: |
          mkdir -p config/includes.chroot/usr/lib/honeycrisp-shell
          cp -r /path/to/honeycrisp_shell/build/linux/x64/release/bundle/* config/includes.chroot/usr/lib/honeycrisp-shell/
          chmod +x config/includes.chroot/usr/lib/honeycrisp-shell/honeycrisp_shell
          
          mkdir -p config/includes.chroot/usr/local/bin
          ln -sf /usr/lib/honeycrisp-shell/honeycrisp_shell config/includes.chroot/usr/local/bin/honeycrisp-shell

      - name: Make Build Script Executable
        run: chmod +x build.sh

      - name: Run Build Script
        run: ./build.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeycrisp-os-iso
          path: '*.iso'