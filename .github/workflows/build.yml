name: Build Honeycrisp OS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git $RUNNER_TEMP/flutter
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH

      - name: Build Flutter Shell
        run: |
          cd honeycrisp_shell
          flutter build linux --release

      - name: Inject Flutter Bundle into Live-Build Tree
        run: |
          mkdir -p config/includes.chroot/usr/lib/honeycrisp_shell
          cp -r honeycrisp_shell/build/linux/x64/release/bundle/* config/includes.chroot/usr/lib/honeycrisp_shell/
          chmod +x config/includes.chroot/usr/lib/honeycrisp_shell/honeycrisp_shell
          
          mkdir -p config/includes.chroot/usr/local/bin
          ln -sf /usr/lib/honeycrisp_shell/honeycrisp_shell config/includes.chroot/usr/local/bin/honeycrisp_shell

      - name: Make Build Script Executable
        run: chmod +x build.sh

      - name: Run Build Script
        run: ./build.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeycrisp-os-iso
          path: '*.iso'